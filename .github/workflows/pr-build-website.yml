name: Build website on PR

defaults:
  run:
    shell: bash
    working-directory: ./website

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pr-build-website.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache-dependency-path: ./website/package-lock.json
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
