name: Build website on PR

defaults:
  run:
    shell: bash
    working-directory: ./website

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "package-lock.json"
      - "yarn.lock"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - ".github/workflows/pr-build-website.yml"

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard against duplicate lockfiles
        working-directory: ${{ github.workspace }}
        run: |
          extra=$(git ls-files | grep -E '(^|/)(yarn\.lock|pnpm-lock\.yaml)$|^package-lock\.json$' || true)
          if [ -n "$extra" ]; then
            echo "::error::website/package-lock.json is the only lockfile that may be tracked. Found: $extra"
            exit 1
          fi
          echo "Only website/package-lock.json is tracked."

      - uses: actions/setup-node@v6
        with:
          cache-dependency-path: ./website/package-lock.json
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
